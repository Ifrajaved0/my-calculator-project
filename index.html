<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
</body>
</html>
<h2 class="sr-only">Interactive calculator with arithmetic operations and keyboard support</h2>

<div class="shell">
  <div class="display">
    <div class="kb-hint">keyboard enabled</div>
    <div class="display-expr" id="expr"></div>
    <div class="display-main" id="disp">0</div>
  </div>
  <div class="pad" id="pad">
    <button class="btn fn" data-act="clear">AC</button>
    <button class="btn fn" data-act="sign">+/−</button>
    <button class="btn fn" data-act="pct">%</button>
    <button class="btn op" data-act="op" data-val="÷">÷</button>

    <button class="btn num" data-act="num" data-val="7">7</button>
    <button class="btn num" data-act="num" data-val="8">8</button>
    <button class="btn num" data-act="num" data-val="9">9</button>
    <button class="btn op" data-act="op" data-val="×">×</button>

    <button class="btn num" data-act="num" data-val="4">4</button>
    <button class="btn num" data-act="num" data-val="5">5</button>
    <button class="btn num" data-act="num" data-val="6">6</button>
    <button class="btn op" data-act="op" data-val="−">−</button>

    <button class="btn num" data-act="num" data-val="1">1</button>
    <button class="btn num" data-act="num" data-val="2">2</button>
    <button class="btn num" data-act="num" data-val="3">3</button>
    <button class="btn op" data-act="op" data-val="+">+</button>

    <button class="btn num zero wide" data-act="num" data-val="0">0</button>
    <button class="btn num" data-act="dot">.</button>
    <button class="btn eq" data-act="eq">=</button>
  </div>
</div>

<script>
const disp = document.getElementById('disp');
const expr = document.getElementById('expr');
let cur = '0', prev = '', op = null, fresh = false, justEvaled = false;

function setDisp(v){
  disp.textContent = v;
  const l = v.length;
  disp.className = 'display-main' + (l>12?' xs':l>9?' sm':'');
}

function ripple(btn, e){
  const r = document.createElement('div');
  r.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  r.style.left = ((e.clientX||rect.left+rect.width/2)-rect.left)+'px';
  r.style.top  = ((e.clientY||rect.top+rect.height/2)-rect.top)+'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(),400);
}

function flash(){disp.classList.remove('flash');void disp.offsetWidth;disp.classList.add('flash');}

function setOp(o){
  document.querySelectorAll('.btn.op').forEach(b=>b.classList.toggle('active-op', b.dataset.val===o));
}

function compute(){
  const a=parseFloat(prev), b=parseFloat(cur);
  if(isNaN(a)||isNaN(b))return cur;
  let r;
  switch(op){
    case '+': r=a+b; break;
    case '−': r=a-b; break;
    case '×': r=a*b; break;
    case '÷': r=b===0?'Error':a/b; break;
    default: return cur;
  }
  if(r==='Error')return 'Error';
  const s = parseFloat(r.toFixed(10));
  return String(s);
}

function handleAct(act, val){
  if(act==='num'){
    if(justEvaled){cur='0';justEvaled=false;}
    if(fresh){cur='0';fresh=false;}
    cur = cur==='0'&&val!=='.' ? val : (cur.length<12 ? cur+val : cur);
    setDisp(cur); expr.textContent='';
  }
  else if(act==='dot'){
    if(justEvaled){cur='0';justEvaled=false;}
    if(fresh){cur='0';fresh=false;}
    if(!cur.includes('.')){cur+='.';setDisp(cur);}
  }
  else if(act==='op'){
    if(op&&!fresh&&!justEvaled){
      const res=compute();
      expr.textContent=prev+' '+op+' '+cur+' '+val;
      prev=res; cur=res; setDisp(res); flash();
    } else {
      prev=cur;
      expr.textContent=cur+' '+val;
    }
    op=val; fresh=true; justEvaled=false;
    setOp(val);
  }
  else if(act==='eq'){
    if(!op)return;
    const res=compute();
    expr.textContent=prev+' '+op+' '+cur+' =';
    setDisp(res); flash(); cur=res; prev=''; op=null; fresh=false; justEvaled=true;
    setOp(null);
  }
  else if(act==='clear'){
    cur='0';prev='';op=null;fresh=false;justEvaled=false;
    setDisp('0'); expr.textContent=''; setOp(null);
  }
  else if(act==='sign'){
    cur=String(parseFloat(cur)*-1); setDisp(cur);
  }
  else if(act==='pct'){
    cur=String(parseFloat(cur)/100); setDisp(cur);
  }
}

document.getElementById('pad').addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');
  if(!btn)return;
  ripple(btn,e);
  handleAct(btn.dataset.act, btn.dataset.val);
});

const keyMap={
  '0':'num','1':'num','2':'num','3':'num','4':'num',
  '5':'num','6':'num','7':'num','8':'num','9':'num',
  '.':'dot',',':'dot',
  '+':'op','-':'op','*':'op','/':'op',
  'Enter':'eq','=':'eq',
  'Backspace':'back','Escape':'clear','Delete':'clear','%':'pct'
};
const opMap={'+':'+','-':'−','*':'×','/':'÷'};

document.addEventListener('keydown',e=>{
  const act=keyMap[e.key];
  if(!act)return;
  e.preventDefault();
  if(act==='back'){
    if(cur.length>1){cur=cur.slice(0,-1);}else{cur='0';}
    setDisp(cur); return;
  }
  const val = act==='num'?e.key : act==='op'?opMap[e.key] : undefined;
  const btn = [...document.querySelectorAll('[data-act]')].find(b=>{
    if(act==='op')return b.dataset.act==='op'&&b.dataset.val===val;
    if(act==='num')return b.dataset.act==='num'&&b.dataset.val===val;
    return b.dataset.act===act;
  });
  if(btn){ripple(btn,{});}
  handleAct(act, val);
});

setDisp('0');
</script>
